<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8dd">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>找一找是哪个</title>
  <style>
    :root {
      --ink: #29324b;
      --muted: #69718a;
      --cream: #fff8dd;
      --card: rgba(255, 255, 255, .9);
      --yellow: #ffd84d;
      --yellow-dark: #e6ad16;
      --coral: #ff7c70;
      --blue: #7bc8f6;
      --green: #71d6a1;
      --purple: #a88cf7;
      --shadow: 0 18px 50px rgba(63, 55, 35, .14);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overscroll-behavior: none;
    }

    body {
      color: var(--ink);
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background:
        radial-gradient(circle at 12% 17%, rgba(255, 216, 77, .45) 0 8%, transparent 8.4%),
        radial-gradient(circle at 88% 22%, rgba(123, 200, 246, .32) 0 9%, transparent 9.4%),
        linear-gradient(145deg, #fffdf2, var(--cream));
      overflow-x: hidden;
    }

    button { font: inherit; color: inherit; }
    button:focus-visible { outline: 4px solid rgba(41, 50, 75, .3); outline-offset: 3px; }

    .app {
      width: 100%;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      position: relative;
      isolation: isolate;
      padding: max(18px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
    }

    .doodle { position: fixed; z-index: -1; pointer-events: none; opacity: .72; }
    .doodle.one { left: 3vw; bottom: 7vh; font-size: clamp(3rem, 8vw, 7rem); transform: rotate(-10deg); }
    .doodle.two { right: 4vw; bottom: 6vh; font-size: clamp(2.5rem, 7vw, 6rem); transform: rotate(12deg); }

    .topbar {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-right: 92px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 900;
      font-size: clamp(1.05rem, 2.3vw, 1.35rem);
    }

    .brand-mark {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      font-size: 1.7rem;
      background: #fff;
      box-shadow: 0 8px 22px rgba(63, 55, 35, .12);
    }

    .progress-pill {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 48px;
      padding: 8px 15px;
      background: rgba(255, 255, 255, .75);
      border: 2px solid rgba(255, 255, 255, .9);
      border-radius: 999px;
      font-weight: 800;
      box-shadow: 0 8px 25px rgba(63, 55, 35, .08);
    }

    .exit-button {
      position: fixed;
      z-index: 30;
      top: max(18px, env(safe-area-inset-top));
      right: max(18px, env(safe-area-inset-right));
      width: 70px;
      height: 70px;
      border: 0;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 8px 26px rgba(41, 50, 75, .18), inset 0 0 0 4px rgba(41, 50, 75, .07);
      display: none;
      place-items: center;
      cursor: pointer;
      transition: transform .16s ease;
    }

    .exit-button:active { transform: scale(.92); }
    .exit-button.visible { display: grid; }
    .exit-icon {
      width: 36px;
      height: 36px;
      border: 5px solid var(--coral);
      border-radius: 50%;
      position: relative;
    }
    .exit-icon::before {
      content: "";
      position: absolute;
      width: 6px;
      height: 18px;
      border-radius: 9px;
      background: var(--coral);
      left: 50%;
      top: -10px;
      transform: translateX(-50%);
      box-shadow: 0 0 0 5px #fff;
    }
    .exit-label { position: absolute; top: 72px; font-size: .78rem; font-weight: 900; color: #5f6679; }

    main {
      flex: 1;
      width: min(1180px, 100%);
      margin: 0 auto;
      display: grid;
      place-items: center;
    }

    .screen { width: 100%; display: none; animation: popIn .38s cubic-bezier(.2,.8,.2,1); }
    .screen.active { display: block; }
    @keyframes popIn { from { opacity: 0; transform: translateY(12px) scale(.985); } to { opacity: 1; transform: none; } }

    .home {
      text-align: center;
      padding: clamp(10px, 3vh, 34px) 0;
    }

    .hero-art {
      width: min(540px, 88vw);
      height: clamp(170px, 27vh, 270px);
      margin: 0 auto 10px;
      position: relative;
      display: grid;
      place-items: center;
    }

    .story-book {
      width: 52%;
      aspect-ratio: 1.6;
      border-radius: 18px 18px 28px 28px;
      background: linear-gradient(90deg, #7bc8f6 0 48%, #eef9ff 48% 52%, #a88cf7 52%);
      box-shadow: 0 22px 36px rgba(60, 74, 116, .22);
      transform: perspective(500px) rotateX(12deg);
      display: grid;
      place-items: center;
      font-size: clamp(3.4rem, 9vw, 6.2rem);
    }

    .float-emoji { position: absolute; font-size: clamp(2.6rem, 7vw, 5rem); filter: drop-shadow(0 10px 12px rgba(41,50,75,.15)); animation: float 3s ease-in-out infinite; }
    .float-emoji.a { left: 3%; top: 8%; }
    .float-emoji.b { right: 4%; top: 5%; animation-delay: -.8s; }
    .float-emoji.c { right: 10%; bottom: 0; animation-delay: -1.6s; }
    @keyframes float { 50% { transform: translateY(-11px) rotate(4deg); } }

    h1 { margin: 6px 0 8px; font-size: clamp(2.4rem, 7vw, 5.4rem); line-height: 1; letter-spacing: -.04em; }
    .home-subtitle { margin: 0 auto 26px; max-width: 720px; color: var(--muted); font-size: clamp(1.05rem, 2.6vw, 1.35rem); font-weight: 650; line-height: 1.65; }

    .primary-button, .secondary-button, .submit-button {
      min-height: 62px;
      border: 0;
      border-radius: 22px;
      padding: 14px 28px;
      font-weight: 950;
      cursor: pointer;
      box-shadow: 0 9px 0 rgba(166, 120, 0, .22), 0 16px 30px rgba(63, 55, 35, .15);
      transition: transform .12s ease, box-shadow .12s ease;
      touch-action: manipulation;
    }
    .primary-button:active, .submit-button:active { transform: translateY(6px); box-shadow: 0 3px 0 rgba(166, 120, 0, .22); }
    .primary-button, .submit-button { background: var(--yellow); font-size: clamp(1.2rem, 3vw, 1.55rem); }
    .primary-button { min-width: min(310px, 86vw); }
    .secondary-button { background: #fff; font-size: 1.05rem; box-shadow: 0 7px 0 rgba(41,50,75,.12), 0 14px 26px rgba(63,55,35,.12); }
    .secondary-button:active { transform: translateY(4px); box-shadow: 0 3px 0 rgba(41,50,75,.12); }

    .home-hint { margin: 22px 0 0; color: var(--muted); font-size: .95rem; }

    .game-layout {
      display: grid;
      grid-template-columns: minmax(300px, .88fr) minmax(420px, 1.35fr);
      gap: clamp(18px, 3vw, 34px);
      align-items: stretch;
      padding: 12px 0 24px;
    }

    .scene-card, .content-card {
      background: var(--card);
      border: 3px solid rgba(255,255,255,.95);
      border-radius: 34px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .scene-card {
      min-height: 510px;
      padding: clamp(20px, 3vw, 34px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: linear-gradient(170deg, rgba(255,255,255,.94), rgba(239,249,255,.92));
    }

    .story-number { color: var(--purple); font-size: .9rem; font-weight: 950; letter-spacing: .08em; }
    .scene-emoji { min-height: 220px; display: grid; place-items: center; font-size: clamp(6rem, 15vw, 10rem); filter: drop-shadow(0 20px 20px rgba(41,50,75,.14)); }
    .story-title { margin: 2px 0 8px; font-size: clamp(1.7rem, 3.5vw, 2.45rem); line-height: 1.15; }
    .story-lead { margin: 0; color: var(--muted); font-size: 1rem; line-height: 1.55; }

    .audio-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; margin-top: 20px; }
    .listen-button {
      min-height: 58px;
      border: 0;
      border-radius: 20px;
      background: var(--blue);
      font-size: 1.08rem;
      font-weight: 950;
      cursor: pointer;
    }
    .sound-button {
      width: 58px;
      min-height: 58px;
      border: 0;
      border-radius: 20px;
      background: #fff;
      font-size: 1.45rem;
      cursor: pointer;
      box-shadow: inset 0 0 0 2px rgba(41,50,75,.08);
    }

    .content-card { min-height: 510px; padding: clamp(22px, 3vw, 38px); }
    .story-panel h2, .quiz-panel h2 { margin: 0 0 14px; font-size: clamp(1.55rem, 3.5vw, 2.3rem); }
    .story-text {
      font-size: clamp(1.18rem, 2.4vw, 1.48rem);
      line-height: 1.95;
      font-weight: 650;
      background: #fffdf3;
      border-radius: 24px;
      padding: clamp(20px, 3vw, 32px);
      border: 2px dashed rgba(230,173,22,.45);
      margin: 16px 0 22px;
    }

    .tip { display: flex; gap: 10px; align-items: flex-start; color: var(--muted); line-height: 1.55; margin-bottom: 22px; }
    .tip span:first-child { font-size: 1.35rem; }
    .story-actions { display: flex; flex-wrap: wrap; gap: 14px; }

    .quiz-head { display: flex; justify-content: space-between; gap: 18px; align-items: center; margin-bottom: 16px; }
    .question-count { color: var(--muted); font-weight: 850; white-space: nowrap; }
    .progress-track { height: 12px; border-radius: 99px; background: #edf0f5; overflow: hidden; margin-bottom: 22px; }
    .progress-fill { height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--green), var(--blue)); transition: width .28s ease; }
    .question-line { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 0 0 22px; }
    .question-title { margin: 0; font-size: clamp(1.35rem, 3vw, 2rem); line-height: 1.45; }
    .question-speak {
      flex: 0 0 auto;
      min-height: 54px;
      border: 0;
      border-radius: 18px;
      padding: 10px 17px;
      background: #e8f7ff;
      color: #2d6d97;
      font-size: 1rem;
      font-weight: 950;
      cursor: pointer;
    }
    .options { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
    .option {
      min-height: 190px;
      border: 3px solid transparent;
      border-radius: 24px;
      background: #f7f8fb;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 13px;
      text-align: center;
      cursor: pointer;
      font-size: clamp(1.02rem, 2vw, 1.2rem);
      font-weight: 900;
      touch-action: manipulation;
      transition: transform .14s ease, border-color .14s ease, background .14s ease;
    }
    .option:active { transform: scale(.97); }
    .option.selected { border-color: var(--purple); background: #f1ecff; }
    .option-emoji { width: 112px; height: 112px; flex: 0 0 112px; border-radius: 28px; display: grid; place-items: center; background: #fff; font-size: 4.9rem; }
    .quiz-nav { display: flex; justify-content: space-between; gap: 14px; margin-top: 24px; align-items: center; }
    .nav-button { min-width: 110px; min-height: 54px; border: 0; border-radius: 18px; background: #eef1f6; font-weight: 900; cursor: pointer; }
    .nav-button:disabled { opacity: .36; }
    .submit-button { min-width: min(230px, 55vw); display: none; }
    .submit-button.visible { display: block; }

    .toast {
      position: fixed;
      z-index: 50;
      left: 50%;
      bottom: max(25px, env(safe-area-inset-bottom));
      transform: translate(-50%, 25px);
      max-width: calc(100vw - 36px);
      padding: 15px 22px;
      border-radius: 18px;
      background: #29324b;
      color: #fff;
      font-weight: 800;
      opacity: 0;
      pointer-events: none;
      transition: .25s ease;
      box-shadow: 0 12px 35px rgba(41,50,75,.3);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    .celebration { text-align: center; padding: clamp(24px, 6vh, 64px) 0; }
    .celebration-card { width: min(680px, 100%); margin: auto; padding: clamp(26px, 6vw, 56px); border-radius: 38px; background: rgba(255,255,255,.92); box-shadow: var(--shadow); }
    .result-emoji { font-size: clamp(6rem, 16vw, 10rem); animation: bounce .8s ease infinite alternate; }
    @keyframes bounce { to { transform: translateY(-12px) rotate(4deg); } }
    .celebration h2 { font-size: clamp(2rem, 5vw, 3.3rem); margin: 12px 0; }
    .score-text { font-size: clamp(1.2rem, 3vw, 1.55rem); color: var(--muted); margin-bottom: 25px; }
    .result-stars {
      min-height: 74px;
      margin: 6px auto 14px;
      font-size: clamp(2.7rem, 7vw, 4.7rem);
      line-height: 1.2;
      letter-spacing: .05em;
      filter: drop-shadow(0 8px 7px rgba(230, 173, 22, .25));
    }
    .result-prompt { margin: 20px 0 15px; font-size: clamp(1.2rem, 3vw, 1.55rem); font-weight: 950; }
    .result-listen { margin: 0 auto 18px; }
    .result-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .result-choice {
      position: relative;
      min-height: 128px;
      border: 0;
      border-radius: 26px;
      padding: 26px 16px 18px;
      display: grid;
      place-items: center;
      gap: 5px;
      cursor: pointer;
      font-size: clamp(1.15rem, 3vw, 1.45rem);
      font-weight: 950;
      box-shadow: 0 8px 0 rgba(41,50,75,.12), 0 16px 30px rgba(63,55,35,.12);
    }
    .result-choice:active { transform: translateY(5px); box-shadow: 0 3px 0 rgba(41,50,75,.12); }
    .result-choice.retry { background: #e6f7ff; }
    .result-choice.next { background: var(--yellow); }
    .result-choice-icon { font-size: 2.5rem; }
    .choice-number {
      position: absolute;
      top: 10px;
      left: 12px;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: #fff;
      color: var(--ink);
      font-size: 1.2rem;
      box-shadow: 0 5px 12px rgba(41,50,75,.12);
    }

    @media (max-width: 820px) {
      .topbar { padding-right: 74px; min-height: 62px; }
      .exit-button { width: 58px; height: 58px; }
      .exit-icon { width: 30px; height: 30px; border-width: 4px; }
      .exit-label { display: none; }
      .progress-pill .progress-copy { display: none; }
      .game-layout { grid-template-columns: 1fr; }
      .scene-card { min-height: 0; display: grid; grid-template-columns: 130px 1fr; gap: 16px; align-items: center; }
      .scene-emoji { min-height: 130px; font-size: 6.5rem; grid-row: 1 / span 2; }
      .audio-row { grid-column: 1 / -1; margin-top: 2px; }
      .content-card { min-height: 0; }
      .option { min-height: 170px; }
      .option-emoji { width: 96px; height: 96px; flex-basis: 96px; font-size: 4.2rem; }
    }

    @media (max-width: 560px) {
      .app { padding-left: 12px; padding-right: 12px; }
      .brand-mark { width: 42px; height: 42px; border-radius: 13px; }
      .scene-card { grid-template-columns: 92px 1fr; border-radius: 26px; }
      .scene-emoji { min-height: 92px; font-size: 4.6rem; }
      .content-card { border-radius: 26px; }
      .question-line { align-items: flex-start; flex-direction: column; }
      .question-speak { width: 100%; }
      .options { grid-template-columns: 1fr; }
      .option { min-height: 96px; flex-direction: row; justify-content: flex-start; text-align: left; }
      .option-emoji { width: 72px; height: 72px; flex-basis: 72px; font-size: 3.2rem; }
      .quiz-nav { flex-wrap: wrap; }
      .submit-button { order: -1; width: 100%; min-width: 100%; }
      .result-actions { grid-template-columns: 1fr; }
      .result-choice { min-height: 100px; }
      h1 { font-size: 2.7rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="doodle one">🌈</div>
    <div class="doodle two">⭐</div>

    <header class="topbar">
      <div class="brand"><span class="brand-mark">🔎</span><span>找一找是哪个</span></div>
      <div class="progress-pill" aria-label="游戏进度"><span>⭐</span><span id="totalStars">0</span><span class="progress-copy">颗星</span></div>
    </header>

    <button id="exitButton" class="exit-button" aria-label="退出游戏">
      <span class="exit-icon" aria-hidden="true"></span>
      <span class="exit-label">退出</span>
    </button>

    <main>
      <section id="homeScreen" class="screen home active">
        <div class="hero-art" aria-hidden="true">
          <span class="float-emoji a">🦕</span>
          <span class="float-emoji b">🐶</span>
          <span class="float-emoji c">🐟</span>
          <div class="story-book">📖</div>
        </div>
        <h1>找一找是哪个</h1>
        <p class="home-subtitle">听一个有趣的中文小故事，再找出藏在故事里的答案吧！<br>每一个故事都不一样。</p>
        <button id="startButton" class="primary-button">🎧 开始听故事</button>
        <p class="home-hint">🎵 开启后会有中文朗读和轻快音乐</p>
      </section>

      <section id="gameScreen" class="screen">
        <div class="game-layout">
          <aside class="scene-card">
            <div class="scene-emoji" id="sceneEmoji" aria-hidden="true">🦕</div>
            <div>
              <div class="story-number" id="storyNumber">全新故事</div>
              <h2 class="story-title" id="storyTitle">恐龙的旅行</h2>
              <p class="story-lead" id="storyLead">仔细听，答案都在故事里。</p>
            </div>
            <div class="audio-row">
              <button id="listenButton" class="listen-button">🔊 重新朗读</button>
              <button id="musicButton" class="sound-button" aria-label="开关背景音乐">🎵</button>
            </div>
          </aside>

          <article class="content-card">
            <div id="storyPanel" class="story-panel">
              <h2>👂 请听好啦</h2>
              <div id="storyText" class="story-text"></div>
              <div class="tip"><span>💡</span><span>听故事的时候，记住里面的人物、颜色、地点和物品。</span></div>
              <div class="story-actions">
                <button id="quizButton" class="primary-button">我听好了，开始答题</button>
              </div>
            </div>

            <div id="quizPanel" class="quiz-panel" hidden>
              <div class="quiz-head">
                <h2>🔍 找一找</h2>
                <div id="questionCount" class="question-count">第 1 题 / 共 5 题</div>
              </div>
              <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
              <div class="question-line">
                <h3 id="questionTitle" class="question-title" aria-live="polite"></h3>
                <button id="questionSpeakButton" class="question-speak">🔊 再听一遍问题</button>
              </div>
              <div id="options" class="options"></div>
              <div class="quiz-nav">
                <button id="prevButton" class="nav-button">上一题</button>
                <button id="submitButton" class="submit-button">提交答案</button>
                <button id="nextButton" class="nav-button">下一题</button>
              </div>
            </div>
          </article>
        </div>
      </section>

      <section id="resultScreen" class="screen celebration">
        <div class="celebration-card">
          <div id="resultEmoji" class="result-emoji">🎉</div>
          <h2 id="resultTitle">太棒了！</h2>
          <div id="resultStars" class="result-stars" aria-label="本次获得的星星"></div>
          <p id="scoreText" class="score-text"></p>
          <p class="result-prompt">你想再来一次，还是下一关？</p>
          <button id="resultSpeakButton" class="question-speak result-listen">🔊 再听一遍结果</button>
          <div class="result-actions">
            <button id="retryButton" class="result-choice retry">
              <span class="choice-number">1</span>
              <span class="result-choice-icon" aria-hidden="true">🔁</span>
              <span>再来一次</span>
            </button>
            <button id="nextStoryButton" class="result-choice next">
              <span class="choice-number">2</span>
              <span class="result-choice-icon" aria-hidden="true">📖</span>
              <span>下一关</span>
            </button>
          </div>
        </div>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    const DATA = {
      names: [
        { text: "小七", emoji: "👧🏻" }, { text: "乐乐", emoji: "👦🏻" },
        { text: "糖糖", emoji: "👧🏽" }, { text: "明明", emoji: "👦🏽" },
        { text: "可可", emoji: "🧒🏻" }, { text: "豆豆", emoji: "🧒🏽" }
      ],
      animals: [
        { text: "小狗", emoji: "🐶" }, { text: "小猫", emoji: "🐱" },
        { text: "小恐龙", emoji: "🦕" }, { text: "小兔子", emoji: "🐰" },
        { text: "小熊", emoji: "🐻" }, { text: "小企鹅", emoji: "🐧" }
      ],
      colors: [
        { text: "红色", emoji: "🔴" }, { text: "蓝色", emoji: "🔵" },
        { text: "黄色", emoji: "🟡" }, { text: "绿色", emoji: "🟢" },
        { text: "紫色", emoji: "🟣" }, { text: "橙色", emoji: "🟠" }
      ],
      places: [
        { text: "森林", emoji: "🌲" }, { text: "海边", emoji: "🏖️" },
        { text: "果园", emoji: "🍎" }, { text: "公园", emoji: "🌳" },
        { text: "星星山", emoji: "⭐" }, { text: "彩虹村", emoji: "🌈" }
      ],
      objects: [
        { text: "小雨伞", emoji: "🌂" }, { text: "红苹果", emoji: "🍎" },
        { text: "黄气球", emoji: "🎈" }, { text: "小背包", emoji: "🎒" },
        { text: "玩具火车", emoji: "🚂" }, { text: "魔法铃铛", emoji: "🔔" },
        { text: "圆圆的饼干", emoji: "🍪" }, { text: "金色钥匙", emoji: "🔑" }
      ],
      foods: [
        { text: "草莓蛋糕", emoji: "🍰" }, { text: "香蕉", emoji: "🍌" },
        { text: "胡萝卜", emoji: "🥕" }, { text: "玉米", emoji: "🌽" },
        { text: "蓝莓", emoji: "🫐" }, { text: "西瓜", emoji: "🍉" }
      ],
      weather: [
        { text: "阳光明媚", emoji: "☀️" }, { text: "下着小雨", emoji: "🌧️" },
        { text: "飘着小雪", emoji: "🌨️" }, { text: "吹着微风", emoji: "🌬️" }
      ]
    };

    const THEMES = [
      { title: "森林里的惊喜", scene: "🌲", verb: "散步" },
      { title: "彩虹小火车", scene: "🚂", verb: "探险" },
      { title: "神奇的野餐", scene: "🧺", verb: "野餐" },
      { title: "小小勇士寻宝记", scene: "🌟", verb: "寻找宝物" },
      { title: "云朵上的朋友", scene: "☁️", verb: "参加聚会" }
    ];

    const state = {
      story: null,
      questions: [],
      answers: [],
      currentQuestion: 0,
      completed: Number(localStorage.getItem("findGameCompleted") || 0),
      stars: Number(localStorage.getItem("findGameStars") || 0),
      used: new Set(JSON.parse(localStorage.getItem("findGameUsed") || "[]")),
      musicOn: localStorage.getItem("findGameMusic") !== "off",
      speechToken: 0,
      audioContext: null,
      musicTimer: null
    };

    const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
    const shuffle = (arr) => [...arr].sort(() => Math.random() - .5);
    const takeDifferent = (arr, value, count = 3) => shuffle(arr.filter(x => x.text !== value.text)).slice(0, count);

    function buildQuestion(prompt, answer, pool) {
      const choices = shuffle([answer, ...takeDifferent(pool, answer, 2)]);
      return { prompt, answer: answer.text, choices };
    }

    function generateStory() {
      let story;
      let tries = 0;
      do {
        const theme = pick(THEMES);
        const name = pick(DATA.names);
        const animal = pick(DATA.animals);
        const color = pick(DATA.colors);
        const place = pick(DATA.places);
        const object = pick(DATA.objects);
        const food = pick(DATA.foods);
        const weather = pick(DATA.weather);
        const time = pick([
          { text: "早上", emoji: "🌅" }, { text: "下午", emoji: "🌤️" },
          { text: "傍晚", emoji: "🌇" }, { text: "星星亮起的时候", emoji: "🌌" }
        ]);
        const gift = pick(DATA.objects.filter(x => x.text !== object.text));
        const key = [theme.title, name.text, animal.text, color.text, place.text, object.text, food.text, weather.text, time.text, gift.text].join("|");
        const text = `${time.text}，${weather.text}。${name.text}背着${color.text}的小包，带着${animal.text}去${place.text}${theme.verb}。路上，他们在一棵大树下发现了${object.text}。${animal.text}轻轻碰了一下，竟然听见了清脆的铃声。不久，他们遇到一位好心的老奶奶。老奶奶送给他们${gift.text}，还请他们一起吃${food.text}。${name.text}开心地说：“今天真是充满惊喜的一天！”`;
        story = { key, title: theme.title, scene: theme.scene, text, name, animal, color, place, object, food, weather, time, gift };
        tries++;
      } while (state.used.has(story.key) && tries < 80);

      state.used.add(story.key);
      if (state.used.size > 120) state.used = new Set([story.key]);
      localStorage.setItem("findGameUsed", JSON.stringify([...state.used]));

      const allQuestions = [
        buildQuestion("故事里的小朋友叫什么名字？", story.name, DATA.names),
        buildQuestion("谁和小朋友一起去玩？", story.animal, DATA.animals),
        buildQuestion("小包是什么颜色的？", story.color, DATA.colors),
        buildQuestion("他们去了什么地方？", story.place, DATA.places),
        buildQuestion("他们在大树下发现了什么？", story.object, DATA.objects),
        buildQuestion("老奶奶请他们吃什么？", story.food, DATA.foods),
        buildQuestion("老奶奶送给他们什么礼物？", story.gift, DATA.objects)
      ];
      const count = 5 + Math.floor(Math.random() * 3);
      story.questions = shuffle(allQuestions).slice(0, count);
      return story;
    }

    function showScreen(id) {
      document.querySelectorAll(".screen").forEach(el => el.classList.toggle("active", el.id === id));
      $("exitButton").classList.toggle("visible", id !== "homeScreen");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function updateHeader() {
      $("totalStars").textContent = state.stars;
      $("musicButton").textContent = state.musicOn ? "🎵" : "🔇";
    }

    function beginStory() {
      stopSpeech();
      state.story = generateStory();
      state.questions = state.story.questions;
      state.answers = Array(state.questions.length).fill(null);
      state.currentQuestion = 0;

      $("sceneEmoji").textContent = state.story.scene;
      $("storyNumber").textContent = `第 ${state.completed + 1} 个全新故事`;
      $("storyTitle").textContent = state.story.title;
      $("storyText").textContent = state.story.text;
      $("storyPanel").hidden = false;
      $("quizPanel").hidden = true;
      showScreen("gameScreen");
      startMusic();
      setTimeout(() => speakStory(true), 350);
    }

    function getChineseVoice() {
      const voices = speechSynthesis.getVoices();
      return voices.find(v => /zh-CN/i.test(v.lang)) || voices.find(v => /^zh/i.test(v.lang)) || null;
    }

    function stopSpeech() {
      state.speechToken++;
      if (state.questionSpeechTimer) clearTimeout(state.questionSpeechTimer);
      if (state.resultSpeechTimer) clearTimeout(state.resultSpeechTimer);
      state.questionSpeechTimer = null;
      state.resultSpeechTimer = null;
      if ("speechSynthesis" in window) speechSynthesis.cancel();
      const storyButton = $("listenButton");
      const questionButton = $("questionSpeakButton");
      const resultButton = $("resultSpeakButton");
      if (storyButton) storyButton.textContent = "🔊 重新朗读";
      if (questionButton) questionButton.textContent = "🔊 再听一遍问题";
      if (resultButton) resultButton.textContent = "🔊 再听一遍结果";
    }

    function speakChinese(text, { rate = .88, pitch = 1.08, onStart, onEnd } = {}) {
      if (!("speechSynthesis" in window)) {
        toast("这台设备暂时不支持语音朗读。");
        return false;
      }
      stopSpeech();
      const token = state.speechToken;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "zh-CN";
      utterance.rate = rate;
      utterance.pitch = pitch;
      utterance.volume = 1;
      const voice = getChineseVoice();
      if (voice) utterance.voice = voice;
      utterance.onstart = () => { if (token === state.speechToken) onStart?.(); };
      const finish = () => { if (token === state.speechToken) onEnd?.(); };
      utterance.onend = finish;
      utterance.onerror = finish;
      speechSynthesis.speak(utterance);
      return true;
    }

    function speakStory(fromStart = false) {
      if (!("speechSynthesis" in window)) {
        toast("这台设备暂时不支持语音朗读，可以直接阅读故事。");
        return;
      }
      if (speechSynthesis.speaking && !fromStart) {
        stopSpeech();
        return;
      }
      speakChinese(state.story.text, {
        onStart: () => $("listenButton").textContent = "⏹️ 停止朗读",
        onEnd: () => $("listenButton").textContent = "🔊 重新朗读"
      });
    }

    function speakQuestion() {
      const q = state.questions[state.currentQuestion];
      if (!q) return;
      const numbers = ["一", "二", "三"];
      const choices = q.choices.map((choice, index) => `选项${numbers[index]}，${choice.text}`).join("。");
      speakChinese(`${q.prompt}。${choices}。请点击图形选择答案。`, {
        rate: .82,
        onStart: () => $("questionSpeakButton").textContent = "⏹️ 停止读题",
        onEnd: () => $("questionSpeakButton").textContent = "🔊 再听一遍问题"
      });
    }

    function speakChoice(choice) {
      speakChinese(`你选择了，${choice}。`, { rate: .84 });
    }

    function speakResult(score) {
      const earned = score === 0
        ? "这次还没有获得星星"
        : `这次答对了${score}道题，获得${score}颗星星`;
      speakChinese(`${earned}。现在一共有${state.stars}颗星星。你想再来一次，还是下一关？选项一，再来一次。选项二，下一关。`, {
        rate: .82,
        onStart: () => $("resultSpeakButton").textContent = "⏹️ 停止播报",
        onEnd: () => $("resultSpeakButton").textContent = "🔊 再听一遍结果"
      });
    }

    function startQuiz() {
      stopSpeech();
      $("storyPanel").hidden = true;
      $("quizPanel").hidden = false;
      renderQuestion();
    }

    function renderQuestion() {
      const q = state.questions[state.currentQuestion];
      const total = state.questions.length;
      $("questionCount").textContent = `第 ${state.currentQuestion + 1} 题 / 共 ${total} 题`;
      $("progressFill").style.width = `${((state.currentQuestion + 1) / total) * 100}%`;
      $("questionTitle").textContent = q.prompt;
      $("options").innerHTML = "";
      q.choices.forEach(choice => {
        const button = document.createElement("button");
        button.className = "option" + (state.answers[state.currentQuestion] === choice.text ? " selected" : "");
        button.setAttribute("aria-label", choice.text);
        button.innerHTML = `<span class="option-emoji" aria-hidden="true">${choice.emoji}</span><span>${choice.text}</span>`;
        button.addEventListener("click", () => {
          state.answers[state.currentQuestion] = choice.text;
          $("options").querySelectorAll(".option").forEach(option => option.classList.remove("selected"));
          button.classList.add("selected");
          speakChoice(choice.text);
        });
        $("options").appendChild(button);
      });
      $("prevButton").disabled = state.currentQuestion === 0;
      $("nextButton").style.display = state.currentQuestion === total - 1 ? "none" : "block";
      $("submitButton").classList.toggle("visible", state.currentQuestion === total - 1);
      state.questionSpeechTimer = setTimeout(speakQuestion, 320);
    }

    function submitAnswers() {
      const missing = state.answers.findIndex(x => !x);
      if (missing !== -1) {
        state.currentQuestion = missing;
        renderQuestion();
        toast(`还有一题没有选答案哦！`);
        return;
      }
      stopSpeech();
      const score = state.questions.reduce((sum, q, i) => sum + (state.answers[i] === q.answer ? 1 : 0), 0);
      state.stars += score;
      localStorage.setItem("findGameStars", state.stars);
      updateHeader();

      const ratio = score / state.questions.length;
      $("resultEmoji").textContent = ratio === 1 ? "🏆" : ratio >= .6 ? "🎉" : "🌟";
      $("resultTitle").textContent = ratio === 1 ? "全部答对啦！" : ratio >= .6 ? "真棒！" : "你很勇敢！";
      $("resultStars").textContent = score > 0 ? "⭐".repeat(score) : "☆";
      $("resultStars").setAttribute("aria-label", `本次获得 ${score} 颗星星`);
      $("scoreText").textContent = `本次答对 ${score} 道题，获得 ${score} 颗星星。现在共有 ${state.stars} 颗星星。`;
      showScreen("resultScreen");
      playCelebration();
      state.lastScore = score;
      state.resultSpeechTimer = setTimeout(() => speakResult(score), 900);
    }

    function replayCurrentStory() {
      state.answers = Array(state.questions.length).fill(null);
      state.currentQuestion = 0;
      $("storyPanel").hidden = false;
      $("quizPanel").hidden = true;
      showScreen("gameScreen");
      startMusic();
      setTimeout(() => speakStory(true), 350);
    }

    function announceThen(message, action) {
      const started = speakChinese(message, { rate: .84, onEnd: action });
      if (!started) action();
    }

    function chooseRetry() {
      announceThen("选项一，再来一次。现在重新播放刚才的故事。", replayCurrentStory);
    }

    function chooseNextStory() {
      announceThen("选项二，下一关。现在播放一个全新的故事。", () => {
        state.completed += 1;
        localStorage.setItem("findGameCompleted", state.completed);
        beginStory();
      });
    }

    function ensureAudio() {
      if (!state.audioContext) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) state.audioContext = new AudioCtx();
      }
      if (state.audioContext?.state === "suspended") state.audioContext.resume();
      return state.audioContext;
    }

    function tone(frequency, start, duration, volume = .025) {
      const ctx = ensureAudio();
      if (!ctx || !state.musicOn) return;
      const oscillator = ctx.createOscillator();
      const gain = ctx.createGain();
      oscillator.type = "sine";
      oscillator.frequency.value = frequency;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(volume, start + .03);
      gain.gain.exponentialRampToValueAtTime(.0001, start + duration);
      oscillator.connect(gain).connect(ctx.destination);
      oscillator.start(start);
      oscillator.stop(start + duration + .03);
    }

    function startMusic() {
      stopMusic();
      if (!state.musicOn) return;
      const ctx = ensureAudio();
      if (!ctx) return;
      const melody = [523.25, 659.25, 783.99, 659.25, 587.33, 698.46, 783.99, 698.46];
      let step = 0;
      const play = () => {
        if (!state.musicOn || !state.audioContext) return;
        tone(melody[step % melody.length], state.audioContext.currentTime, .42, .018);
        step++;
      };
      play();
      state.musicTimer = setInterval(play, 620);
    }

    function stopMusic() {
      if (state.musicTimer) clearInterval(state.musicTimer);
      state.musicTimer = null;
    }

    function playCelebration() {
      if (!state.musicOn) return;
      const ctx = ensureAudio();
      if (!ctx) return;
      stopMusic();
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, ctx.currentTime + i * .13, .5, .045));
    }

    function toggleMusic() {
      state.musicOn = !state.musicOn;
      localStorage.setItem("findGameMusic", state.musicOn ? "on" : "off");
      updateHeader();
      if (state.musicOn && $("gameScreen").classList.contains("active")) startMusic();
      else stopMusic();
    }

    let toastTimer;
    function toast(message) {
      clearTimeout(toastTimer);
      $("toast").textContent = message;
      $("toast").classList.add("show");
      toastTimer = setTimeout(() => $("toast").classList.remove("show"), 2400);
    }

    function exitGame() {
      stopSpeech();
      stopMusic();
      showScreen("homeScreen");
    }

    $("startButton").addEventListener("click", () => { ensureAudio(); beginStory(); });
    $("exitButton").addEventListener("click", exitGame);
    $("listenButton").addEventListener("click", () => speakStory(false));
    $("musicButton").addEventListener("click", toggleMusic);
    $("quizButton").addEventListener("click", startQuiz);
    $("questionSpeakButton").addEventListener("click", () => {
      if ("speechSynthesis" in window && speechSynthesis.speaking && $("questionSpeakButton").textContent.includes("停止")) stopSpeech();
      else speakQuestion();
    });
    $("prevButton").addEventListener("click", () => { if (state.currentQuestion > 0) { state.currentQuestion--; renderQuestion(); } });
    $("nextButton").addEventListener("click", () => {
      if (!state.answers[state.currentQuestion]) { toast("先选一个答案吧！"); return; }
      if (state.currentQuestion < state.questions.length - 1) { state.currentQuestion++; renderQuestion(); }
    });
    $("submitButton").addEventListener("click", submitAnswers);
    $("resultSpeakButton").addEventListener("click", () => {
      if ("speechSynthesis" in window && speechSynthesis.speaking && $("resultSpeakButton").textContent.includes("停止")) stopSpeech();
      else speakResult(state.lastScore || 0);
    });
    $("retryButton").addEventListener("click", chooseRetry);
    $("nextStoryButton").addEventListener("click", chooseNextStory);
    document.addEventListener("visibilitychange", () => { if (document.hidden) { stopSpeech(); stopMusic(); } });
    window.addEventListener("pagehide", () => { stopSpeech(); stopMusic(); });
    if ("speechSynthesis" in window) speechSynthesis.getVoices();
    updateHeader();
  </script>
</body>
</html>
